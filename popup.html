<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Openfront+</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <span class="mark" aria-hidden="true">☢</span>
        <span class="title">
          <strong>Openfront+</strong>
          <small>Unofficial openfront extension to improve the game</small>
        </span>
      </header>

      <div class="toolbar">
        <span class="enabled-count" id="enabledCount" aria-live="polite"></span>
        <span class="toolbar-spacer"></span>
        <button type="button" class="link-btn" id="enableAll">Enable all</button>
        <button type="button" class="link-btn" id="disableAll">Disable all</button>
        <button type="button" class="link-btn" id="resetDefaults">Reset</button>
      </div>

      <!-- ============ NUKES & COMBAT ============ -->
      <section class="collapsible-section open" data-section="nukes">
        <button type="button" class="section-header" aria-expanded="true">
          <span class="section-title">☢ Nukes &amp; Combat</span>
          <span class="section-count" data-section-count="nukes"></span>
          <span class="section-chevron" aria-hidden="true">▶</span>
        </button>
        <div class="collapse-wrap">
          <div class="toggles" aria-label="Nuke features">

            <label class="toggle-card">
              <span class="copy">
                <span class="title-row">
                  <strong>SAM Coverage</strong>
                  <span class="badge badge--blue">☢ Atom only</span>
                </span>
                <small>With the Atom Bomb tool armed (8), rest your cursor on a tile for 1.5 s to see atoms needed, possible enemy SAM upgrades, and total gold cost.</small>
              </span>
              <span class="switch">
                <input id="samCoverage" type="checkbox" />
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>

            <label class="toggle-card">
              <span class="copy">
                <span class="title-row">
                  <strong>Nuke Grouper</strong>
                  <span class="badge badge--yellow">☢ Atoms</span>
                  <span class="badge badge--orange">💣 Hydros</span>
                </span>
                <small>Groups nearby in-flight nukes into stable Your / Ally / Enemy counters with launcher names, atoms and hydrogen shown separately.</small>
              </span>
              <span class="switch">
                <input id="nukeGrouper" type="checkbox" />
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>

            <label class="toggle-card">
              <span class="copy">
                <span class="title-row">
                  <strong>Incoming Nuke Alert</strong>
                  <span class="badge badge--red">☢ Atoms</span>
                  <span class="badge badge--orange">💣 Hydros</span>
                  <span class="badge badge--purple">🚀 MIRV</span>
                </span>
                <small>Live panel of every nuke heading for your territory — type, count, impact countdown, and whether your (+allied) SAMs can stop them in time. MIRV warheads count as interceptable.</small>
              </span>
              <span class="switch">
                <input id="incomingNukeAlert" type="checkbox" />
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>

            <div class="toggle-card toggle-card--collapsible" data-group="airspace" id="airspaceCard">
              <div class="toggle-card-header">
                <button type="button" class="group-expander open" aria-expanded="true" aria-controls="airspaceSubs">
                  <span class="copy">
                    <span class="title-row">
                      <strong>Show Nukes in Airspace</strong>
                      <span class="badge badge--blue">☢ Atoms</span>
                      <span class="badge badge--orange">💣 Hydros</span>
                      <span class="badge badge--purple">🚀 MIRV</span>
                    </span>
                    <small>Global counts of all nukes currently flying.</small>
                  </span>
                  <span class="collapse-arrow" id="airspaceArrow" aria-hidden="true">▶</span>
                </button>
                <label class="switch">
                  <input id="globalNukeActivity" type="checkbox" />
                  <span class="track" aria-hidden="true"></span>
                </label>
              </div>
              <div class="sub-toggles open" id="airspaceSubs">
                <div class="sub-stack">
                  <label class="toggle-card toggle-card--sub" id="personalNukeTrackerCard">
                    <span class="copy">
                      <span class="title-row"><strong>Show Your Nukes</strong></span>
                      <small>Also show how many of them are yours.</small>
                    </span>
                    <span class="switch">
                      <input id="personalNukeTracker" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <label class="toggle-card">
              <span class="copy">
                <span class="title-row">
                  <strong>Enemy Nuke Readiness</strong>
                  <span class="badge badge--red">☢ Silos</span>
                </span>
                <small>Hover any player to see nukes ready in their silos and how many they can afford. Cash-strapped enemies highlight amber.</small>
              </span>
              <span class="switch">
                <input id="enemyNukeReadiness" type="checkbox" />
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>

          </div>
        </div>
      </section>

      <!-- ============ TRADE & INCOME ============ -->
      <section class="collapsible-section open" data-section="economy">
        <button type="button" class="section-header" aria-expanded="true">
          <span class="section-title">💰 Trade &amp; Income</span>
          <span class="section-count" data-section-count="economy"></span>
          <span class="section-chevron" aria-hidden="true">▶</span>
        </button>
        <div class="collapse-wrap">
          <div class="toggles" aria-label="Trade and income features">

            <div class="toggle-card toggle-card--collapsible" data-group="tradePartner" id="tradePartnerCard">
              <div class="toggle-card-header">
                <button type="button" class="group-expander open" aria-expanded="true" aria-controls="tradePartnerSubs">
                  <span class="copy">
                    <span class="title-row">
                      <strong>Trade Partner</strong>
                      <span class="badge badge--blue">💰 Trade</span>
                      <span class="badge badge--red">⚔ Naval</span>
                    </span>
                    <small>Hover any player for your trade income with them (per second + per minute: ships, captures, trains) and naval counters split theirs / mine.</small>
                  </span>
                  <span class="collapse-arrow" id="tradePartnerArrow" aria-hidden="true">▶</span>
                </button>
                <label class="switch">
                  <input id="tradePartner" type="checkbox" />
                  <span class="track" aria-hidden="true"></span>
                </label>
              </div>
              <div class="sub-toggles open" id="tradePartnerSubs">
                <div class="sub-stack">
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Trade Income</strong></span>
                      <small>Gold you earn trading with them.</small>
                    </span>
                    <span class="switch">
                      <input id="tradeIncome" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Trade Ship Captures</strong></span>
                      <small>Captured trade ships, theirs vs mine.</small>
                    </span>
                    <span class="switch">
                      <input id="tradeCaptures" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Transport Ships Down</strong></span>
                      <small>Enemy transports sunk, theirs vs mine.</small>
                    </span>
                    <span class="switch">
                      <input id="tradeTransports" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Warships Down</strong></span>
                      <small>Warships destroyed, theirs vs mine.</small>
                    </span>
                    <span class="switch">
                      <input id="tradeWarships" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <div class="toggle-card toggle-card--collapsible" data-group="playerStats" id="playerStatsCard">
              <div class="toggle-card-header">
                <button type="button" class="group-expander open" aria-expanded="true" aria-controls="playerStatsSubs">
                  <span class="copy">
                    <span class="title-row">
                      <strong>Player Stats Overlay</strong>
                      <span class="badge badge--green">⚔ Troops</span>
                      <span class="badge badge--blue">💰 Gold</span>
                    </span>
                    <small>Hover any player for their troop growth and gold income, same models as your panels.</small>
                  </span>
                  <span class="collapse-arrow" id="playerStatsArrow" aria-hidden="true">▶</span>
                </button>
                <label class="switch">
                  <input id="playerStatsOverlay" type="checkbox" />
                  <span class="track" aria-hidden="true"></span>
                </label>
              </div>
              <div class="sub-toggles open" id="playerStatsSubs">
                <div class="sub-stack">
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Troop Rate (Others)</strong></span>
                      <small>Their natural troop growth per second.</small>
                    </span>
                    <span class="switch">
                      <input id="overlayTroopRate" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Gold Income (Others)</strong></span>
                      <small>Their measured gold income, split by source.</small>
                    </span>
                    <span class="switch">
                      <input id="overlayGoldIncome" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <div class="toggle-card toggle-card--collapsible" data-group="playerIntel" id="playerIntelCard">
              <div class="toggle-card-header">
                <button type="button" class="group-expander open" aria-expanded="true" aria-controls="playerIntelSubs">
                  <span class="copy">
                    <span class="title-row">
                      <strong>Player Intel</strong>
                      <span class="badge badge--red">🚫 Diplomacy</span>
                      <span class="badge badge--yellow">🔋 Tubes</span>
                    </span>
                    <small>Hover any player for diplomacy badges the game never shows (embargoes, doomsday clock) and live launcher readiness percentages.</small>
                  </span>
                  <span class="collapse-arrow" id="playerIntelArrow" aria-hidden="true">▶</span>
                </button>
                <label class="switch">
                  <input id="playerIntel" type="checkbox" />
                  <span class="track" aria-hidden="true"></span>
                </label>
              </div>
              <div class="sub-toggles open" id="playerIntelSubs">
                <div class="sub-stack">
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Embargo &amp; Doomsday Badges</strong></span>
                      <small>Who embargoes whom, plus doomsday-clock status.</small>
                    </span>
                    <span class="switch">
                      <input id="intelDiplomacy" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Launcher Readiness %</strong></span>
                      <small>Share of their SAM/silo tubes ready to fire.</small>
                    </span>
                    <span class="switch">
                      <input id="intelReadinessPct" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>🎯 Targeting</strong></span>
                      <small>Who this player is currently attacking.</small>
                    </span>
                    <span class="switch">
                      <input id="intelTargets" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <div class="toggle-card toggle-card--collapsible" data-group="goldIncome" id="goldIncomeCard">
              <div class="toggle-card-header">
                <button type="button" class="group-expander open" aria-expanded="true" aria-controls="goldIncomeSubs">
                  <span class="copy">
                    <span class="title-row">
                      <strong>Gold Income Display</strong>
                      <span class="badge badge--blue">💰 Gold</span>
                    </span>
                    <small>Your gold income, split into base, ports, captured ships, and trains. Conquest loot excluded. Draggable, position saved.</small>
                  </span>
                  <span class="collapse-arrow" id="goldIncomeArrow" aria-hidden="true">▶</span>
                </button>
                <label class="switch">
                  <input id="goldIncome" type="checkbox" />
                  <span class="track" aria-hidden="true"></span>
                </label>
              </div>
              <div class="sub-toggles open" id="goldIncomeSubs">
                <div class="sub-stack">
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Gold per second</strong></span>
                    </span>
                    <span class="switch">
                      <input id="goldPerSecond" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Gold per minute</strong></span>
                    </span>
                    <span class="switch">
                      <input id="goldPerMinute" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <div class="toggle-card toggle-card--collapsible" data-group="troopRate" id="troopRateCard">
              <div class="toggle-card-header">
                <button type="button" class="group-expander open" aria-expanded="true" aria-controls="troopRateSubs">
                  <span class="copy">
                    <span class="title-row">
                      <strong>Troop Rate Display</strong>
                      <span class="badge badge--green">⚔ Troops</span>
                    </span>
                    <small>Your natural troop growth from the exact game formula. Draggable, position saved.</small>
                  </span>
                  <span class="collapse-arrow" id="troopRateArrow" aria-hidden="true">▶</span>
                </button>
                <label class="switch">
                  <input id="troopRate" type="checkbox" />
                  <span class="track" aria-hidden="true"></span>
                </label>
              </div>
              <div class="sub-toggles open" id="troopRateSubs">
                <div class="sub-stack">
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Troops per second</strong></span>
                    </span>
                    <span class="switch">
                      <input id="troopPerSecond" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                  <label class="toggle-card toggle-card--sub">
                    <span class="copy">
                      <span class="title-row"><strong>Troops per minute</strong></span>
                    </span>
                    <span class="switch">
                      <input id="troopPerMinute" type="checkbox" />
                      <span class="track" aria-hidden="true"></span>
                    </span>
                  </label>
                </div>
              </div>
            </div>

          </div>
        </div>
      </section>

      <!-- ============ SPAWN & MAP ============ -->
      <section class="collapsible-section open" data-section="map">
        <button type="button" class="section-header" aria-expanded="true">
          <span class="section-title">🗺 Spawn &amp; Map</span>
          <span class="section-count" data-section-count="map"></span>
          <span class="section-chevron" aria-hidden="true">▶</span>
        </button>
        <div class="collapse-wrap">
          <div class="toggles" aria-label="Spawn and map features">

            <label class="toggle-card">
              <span class="copy">
                <span class="title-row">
                  <strong>Better Spawn Selection</strong>
                  <span class="badge badge--green">Spawn only</span>
                </span>
                <small>During spawn selection, marks human teammates in your team's color. Auto-hides when spawning ends.</small>
              </span>
              <span class="switch">
                <input id="teammateMarkers" type="checkbox" />
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>

            <label class="toggle-card">
              <span class="copy">
                <span class="title-row">
                  <strong>Build Progress Labels</strong>
                  <span class="badge badge--green">🏗 Construction</span>
                </span>
                <small>Percentage + seconds remaining under every structure's build bar — cities, ports, factories, defense posts, silos, SAMs.</small>
              </span>
              <span class="switch">
                <input id="buildProgress" type="checkbox" />
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>

          </div>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">Settings are stored locally. You won't need to redo them.</p>

      <details class="diagnostics" id="diagnostics">
        <summary>Diagnostics</summary>
        <div class="diag-body" id="diagBody"></div>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
